[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aslot"
version = "2.0.0"
description = "محرّك أسلوط — خمسة محاور تقرأ MASAQ.csv: بناء النصّ، التطبيع، الحصر، التقطيع، التقشير"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Hussein Hiyassat" }]
keywords = ["arabic", "quran", "morphology", "syllabification", "masaq"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
aslot = "aslot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # أسماءُ القواعد والأحكام عربية عمدًا، وruff يقرؤها أحيانًا محارفَ مبهمة.
    "RUF001", "RUF002", "RUF003",
]
